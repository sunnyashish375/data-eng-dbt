version: 2

models:
  - name: employee
    description: "DBT model for employee table"
    columns:
      - name: emp_id
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['1','2','3','4','5']
              config:
                severity: warn
      - name: emp_salary
        tests:
          - value_check
  - name: customer
    description: DBT model for customers
  - name: sales
    description: DBT model for sales
  - name: product
    description: "DBT Model for the product"
  - name: purchase
    description: "DBT MOdel for the purchase"
  - name: claen_orders
    description: "DBT model for orders"
  - name: final_order
    description: "DBT final model for final order"
sources:
  - name: employee
    database: DBT_ID
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC
  - name: sales
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_RAW
  - name: product
    database: DBT_DB
    schema: PUBLIC 
    tables: 
      - name: PRODUCT_SRC
  - name: purchase
    database: DBT_DB
    schema: PUBLIC 
    tables: 
      - name: PURCHASE_SRC
  - name: orders
    database: DBT_DB
    schema: PUBLIC 
    tables: 
      - name: BASE_ORDERS